name: Export GitHub Stars

on:
  # 每周一 00:00 UTC 自动运行
  schedule:
    - cron: '0 0 1 * *'

  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 允许同时只有一个部署任务
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    
    # 添加环境配置，这是 GitHub Pages 部署的标准要求
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5  # 升级到 Node 24 版本

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests openpyxl

    - name: Export GitHub Stars
      env:
        GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python export.py --output ./dist --formats json,csv,xlsx,html

    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true  # 自动启用 Pages（如果尚未启用）

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
