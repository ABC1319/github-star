name: Export GitHub Stars

on:
  # 每月1号 00:00 UTC 自动运行
  schedule:
    - cron: '0 0 1 * *'

  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests openpyxl

    - name: Export GitHub Stars
      env:
        GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ./dist
        python export.py --output ./dist --formats json,csv,xlsx,html --no-readme
        cp ./dist/stars.json ./stars.json
        cp ./dist/stars.csv ./stars.csv
        cp ./dist/stars.xlsx ./stars.xlsx
        cp ./dist/index.html ./index.html
        echo "--- 生成的文件 ---"
        ls -la ./dist/

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add dist/ stars.json stars.csv stars.xlsx index.html
        git diff --staged --quiet && echo "无变更，跳过提交" && exit 0
        git commit -m "chore: update GitHub Stars export"
        git pull --rebase origin main
        git push origin main
